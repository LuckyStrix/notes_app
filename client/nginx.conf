server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large audio/video uploads to pass through to the API.
    client_max_body_size 2048M;

    location /api/ {
        proxy_pass http://server:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;          # needed for SSE streaming chat responses
        proxy_read_timeout 3600s;     # long-running transcription/chat requests
    }

    location / {
        try_files $uri /index.html;
    }
}
