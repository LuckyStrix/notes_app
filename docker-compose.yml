name: notes_app

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-notes}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-notes_app}
    volumes:
      - ${DB_DATA_LOCATION:-./postgres-data}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-notes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  server:
    build: ./server
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-notes}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-notes_app}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      UPLOAD_DIR: /data
    volumes:
      - ${UPLOAD_LOCATION:-./uploads}:/data
      - ./server:/app
      # Read-only: the Settings page lists backups and their validation status,
      # but only the worker ever writes them.
      - ${BACKUP_LOCATION:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-notes}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-notes_app}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      UPLOAD_DIR: /data
    volumes:
      - ${UPLOAD_LOCATION:-./uploads}:/data
      - whisper-cache:/root/.cache/huggingface
      # Where scheduled backups are written. Point BACKUP_LOCATION at another
      # drive to keep them off this one.
      - ${BACKUP_LOCATION:-./backups}:/backups
    extends:
      file: hwaccel.worker.yml
      service: cuda
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  whisper-cache:
